<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Protótipo não-funcional — task A001. HTML/CSS/JS puro, dados mockados, sem persistência real. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editais Abertos — Protótipo A001</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Editais Abertos</h1>
  <p class="subtitle">Acompanhe as chamadas de fomento disponíveis e organize seu progresso</p>
  <!-- FR-023 / A015: total de editais sendo exibidos no momento — total geral
       sem busca/filtro ativo, total já filtrado (getFiltered().length) quando
       há busca e/ou filtro de instituição. Fica junto do título porque é
       visível nas duas visões, sem precisar trocar de aba (aria-live avisa
       leitores de tela quando o número muda). -->
  <p class="edital-count" id="edital-count" aria-live="polite"></p>
</header>

<nav class="view-switch" role="tablist" aria-label="Alternar visão">
  <button type="button" role="tab" id="tab-tabela" aria-selected="true" aria-controls="view-tabela" class="view-btn active" data-view="tabela">Tabela</button>
  <button type="button" role="tab" id="tab-kanban" aria-selected="false" aria-controls="view-kanban" class="view-btn" data-view="kanban">Kanban</button>
</nav>

<main>
  <!-- Barra de controles compartilhada (busca + filtro por instituição): fica
       acima das duas visões porque ambas trocam via toggle Tabela/Kanban e
       precisam do mesmo filtro (US4, FR-018/FR-019). -->
  <div class="controls" id="controls">
    <div class="control-field">
      <label for="search-input">Buscar por chamada</label>
      <input type="search" id="search-input" placeholder="Ex.: inovação, sustentabilidade…">
    </div>
    <div class="control-field">
      <label for="inst-filter">Instituição</label>
      <select id="inst-filter">
        <option value="">Todas as instituições</option>
      </select>
    </div>
  </div>

  <!-- Indicador de busca/filtro ativo (A013) — junto da barra de controles
       porque ela é compartilhada pelas duas visões (US4). Escondido por
       completo (via .hidden) quando nada está filtrado; ver script.js. -->
  <div class="filter-indicator hidden" id="filter-indicator" aria-live="polite">
    <span id="filter-summary"></span>
    <button type="button" id="clear-filters">Limpar filtros</button>
  </div>

  <!-- Visão em tabela -->
  <section id="view-tabela" role="tabpanel" aria-labelledby="tab-tabela" class="view">
    <div class="table-toolbar">
      <label for="sort-fechamento">Ordenar por fechamento</label>
      <select id="sort-fechamento">
        <option value="asc">Mais próximo primeiro</option>
        <option value="desc">Mais distante primeiro</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col">Chamada</th>
            <th scope="col">Fechamento</th>
            <th scope="col">Abertura</th>
            <th scope="col">Link</th>
            <th scope="col">Instituição</th>
            <th scope="col">Descrição</th>
          </tr>
        </thead>
        <tbody id="tabela-corpo">
          <!-- linhas geradas via script.js a partir dos dados mockados -->
        </tbody>
      </table>
    </div>
  </section>

  <!-- Visão kanban -->
  <section id="view-kanban" role="tabpanel" aria-labelledby="tab-kanban" class="view hidden">
    <div class="board" id="board">
      <div class="column" data-status="backlog">
        <h2>Backlog <span class="col-count" data-status="backlog">0</span></h2>
        <div class="card-list" data-status="backlog"></div>
      </div>
      <div class="column" data-status="andamento">
        <h2>Em andamento <span class="col-count" data-status="andamento">0</span></h2>
        <div class="card-list" data-status="andamento"></div>
      </div>
      <div class="column" data-status="validacao">
        <h2>Validação <span class="col-count" data-status="validacao">0</span></h2>
        <div class="card-list" data-status="validacao"></div>
      </div>
      <div class="column" data-status="concluido">
        <h2>Concluído <span class="col-count" data-status="concluido">0</span></h2>
        <div class="card-list" data-status="concluido"></div>
      </div>
    </div>
  </section>
</main>

<template id="card-template">
  <article class="card" draggable="true">
    <h3 class="card-title"></h3>
    <p class="card-inst"></p>
    <p class="card-dates"></p>
    <p class="card-vencido-badge badge-vencido hidden">Vencido</p>
    <p class="card-proximo-badge badge-proximo hidden"></p>
    <a class="card-link" target="_blank" rel="noopener">Ver chamada &#8599;</a>
    <!-- A016 / FR-003: link é opcional no cadastro — quando ausente, mostra texto
         neutro em vez de um "Ver chamada" clicável que não levaria a lugar nenhum. -->
    <span class="card-link-missing hidden">Link não informado</span>
    <div class="card-actions">
      <button type="button" class="move-btn" data-dir="-1" aria-label="Mover para coluna anterior">&larr;</button>
      <button type="button" class="move-btn" data-dir="1" aria-label="Mover para próxima coluna">&rarr;</button>
    </div>
  </article>
</template>

<script src="script.js"></script>
</body>
</html>
